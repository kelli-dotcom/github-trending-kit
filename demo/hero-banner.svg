<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="GitHub Trending Kit — Launch Director & README Conversion Engine">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07131c"/>
      <stop offset="55%" stop-color="#0b1f2e"/>
      <stop offset="100%" stop-color="#062c38"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#06b6d4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#tealGlow)"/>

  <!-- Left Title Block -->
  <g transform="translate(56, 54)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#06b6d4" fill-opacity="0.14" stroke="#06b6d4" stroke-opacity="0.45"/>
    <text x="16" y="19" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.2">CRTA · LAUNCH DIRECTOR</text>

    <text x="0" y="76" fill="#f0fdfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">GitHub Trending Kit</text>
    <text x="0" y="114" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="400">Turn any repo into a high-converting landing page in minutes.</text>

    <!-- Pills -->
    <g transform="translate(0, 144)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">
      <rect x="0" y="0" width="136" height="32" rx="8" fill="#0f2a3a" stroke="#06b6d4" stroke-opacity="0.45"/>
      <text x="16" y="21" fill="#cffafe">5 Launch Skills</text>

      <rect x="148" y="0" width="150" height="32" rx="8" fill="#0f2a3a" stroke="#06b6d4" stroke-opacity="0.45"/>
      <text x="164" y="21" fill="#cffafe">Uneven U Auditor</text>

      <rect x="310" y="0" width="144" height="32" rx="8" fill="#06b6d4" fill-opacity="0.2" stroke="#22d3ee"/>
      <text x="326" y="21" fill="#ecfeff">Live Demo →</text>
    </g>

    <text x="0" y="214" fill="#7dd3fc" fill-opacity="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">MIT · Zero Dependencies · Works with Feather Themes &amp; Agent Etiquette</text>
  </g>

  <!-- Right Visual: Live Conversion Score Card -->
  <g transform="translate(720, 44)">
    <rect x="0" y="0" width="424" height="232" rx="14" fill="#071824" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="424" height="34" rx="14" fill="#0d2838"/>
    <circle cx="20" cy="17" r="5" fill="#06b6d4"/>
    <circle cx="38" cy="17" r="5" fill="#22d3ee" fill-opacity="0.6"/>
    <circle cx="56" cy="17" r="5" fill="#67e8f9" fill-opacity="0.35"/>
    <text x="78" y="21" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">README CONVERSION AUDIT · LIVE</text>

    <!-- Score Bars -->
    <g transform="translate(24, 56)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="0" y="14" fill="#e0f2fe" font-size="13" font-weight="600">First-Screen Value Prop &amp; Visual</text>
      <text x="376" y="14" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="end">96%</text>
      <rect x="0" y="22" width="376" height="8" rx="4" fill="#0e2c3d"/>
      <rect x="0" y="22" width="360" height="8" rx="4" fill="url(#tealGlow)"/>

      <text x="0" y="58" fill="#e0f2fe" font-size="13" font-weight="600">30-Second Quick Start &amp; Live Demo</text>
      <text x="376" y="58" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="end">92%</text>
      <rect x="0" y="66" width="376" height="8" rx="4" fill="#0e2c3d"/>
      <rect x="0" y="66" width="346" height="8" rx="4" fill="url(#tealGlow)"/>

      <text x="0" y="102" fill="#e0f2fe" font-size="13" font-weight="600">Uneven U Arc &amp; Zero-Fluff Prose</text>
      <text x="376" y="102" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="end">94%</text>
      <rect x="0" y="110" width="376" height="8" rx="4" fill="#0e2c3d"/>
      <rect x="0" y="110" width="352" height="8" rx="4" fill="url(#tealGlow)"/>

      <rect x="0" y="136" width="376" height="28" rx="6" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.35"/>
      <text x="14" y="155" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">topics: ai-agents · developer-tools · open-source · mit</text>
    </g>
  </g>
</svg>
