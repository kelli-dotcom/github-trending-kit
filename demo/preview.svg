<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="GitHub Trending Kit launch-director audit demo">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="prog2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      .a1 { opacity: 0; animation: a1 11s infinite; }
      .a2 { opacity: 0; animation: a2 11s infinite; }
      .a3 { opacity: 0; animation: a3 11s infinite; }
      .a4 { opacity: 0; animation: a4 11s infinite; }
      .a5 { opacity: 0; animation: a5 11s infinite; }
      .fill2 { transform-box: fill-box; transform-origin: left center; animation: fill2 11s infinite; }
      .cur2 { animation: blink2 1s step-end infinite; }

      @keyframes a1 { 0%, 4% { opacity: 0; } 8%, 95% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes a2 { 0%, 18% { opacity: 0; } 22%, 95% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes a3 { 0%, 36% { opacity: 0; } 40%, 95% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes a4 { 0%, 54% { opacity: 0; } 58%, 95% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes a5 { 0%, 72% { opacity: 0; } 76%, 95% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes fill2 {
        0%, 12% { transform: scaleX(0); opacity: 0; }
        16% { transform: scaleX(0.1); opacity: 1; }
        74%, 95% { transform: scaleX(1); opacity: 1; }
        100% { transform: scaleX(0); opacity: 0; }
      }
      @keyframes blink2 { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="540" rx="18" fill="url(#bg2)"/>
  <rect x="1" y="1" width="958" height="538" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Top Chrome -->
  <path d="M18 1 H942 A17 17 0 0 1 959 18 V46 H1 V18 A17 17 0 0 1 18 1 Z" fill="#010409"/>
  <circle cx="28" cy="24" r="6.5" fill="#ff7b72"/>
  <circle cx="50" cy="24" r="6.5" fill="#d29922"/>
  <circle cx="72" cy="24" r="6.5" fill="#3fb950"/>
  <text x="480" y="29" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="600" class="sans">github-trending-kit — launch-director Pre-Public Audit</text>

  <!-- Prompt -->
  <g class="a1">
    <text x="36" y="92" fill="#58a6ff" font-size="16" font-weight="700" class="mono">&gt;</text>
    <text x="58" y="92" fill="#e6edf3" font-size="16" class="mono">Run launch-director to audit this repo for GitHub Trending readiness</text>
    <rect x="36" y="112" width="540" height="10" rx="5" fill="#21262d"/>
    <rect x="36" y="112" width="540" height="10" rx="5" fill="url(#prog2)" class="fill2"/>
  </g>

  <!-- Check 1: README Conversion -->
  <g class="a2">
    <rect x="36" y="148" width="888" height="68" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="56" y="176" fill="#3fb950" font-size="15" font-weight="700" class="mono">[ PASS ] readme-conversion-audit</text>
    <text x="56" y="200" fill="#8b949e" font-size="14" class="mono">Above-the-fold hook, animated preview, 1-line Quick Start, and clear value prop verified.</text>
  </g>

  <!-- Check 2: GitHub SEO Topics -->
  <g class="a3">
    <rect x="36" y="232" width="888" height="68" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="56" y="260" fill="#58a6ff" font-size="15" font-weight="700" class="mono">[ PASS ] github-seo-topics</text>
    <text x="56" y="284" fill="#8b949e" font-size="14" class="mono">High-signal Topics, About tagline, and 1280x640 Social Preview specs generated.</text>
  </g>

  <!-- Check 3: Launch Copy -->
  <g class="a4">
    <rect x="36" y="316" width="888" height="68" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="56" y="344" fill="#d2a8ff" font-size="15" font-weight="700" class="mono">[ PASS ] launch-copy-generator</text>
    <text x="56" y="368" fill="#8b949e" font-size="14" class="mono">Platform-native launch posts drafted for Show HN, Reddit, X, and Dev.to + CONTRIBUTING.md.</text>
  </g>

  <!-- Final Verdict -->
  <g class="a5">
    <rect x="36" y="406" width="888" height="58" rx="12" fill="#12261e" stroke="#3fb950" stroke-width="2"/>
    <text x="56" y="441" fill="#3fb950" font-size="17" font-weight="800" class="mono">VERDICT: READY TO FLIP PUBLIC — STAR CONVERSION &amp; DISCOVERABILITY OPTIMIZED</text>
  </g>

  <text x="36" y="508" fill="#8b949e" font-size="13" class="mono">Drop AGENTS.md + agents/ + skills/ + templates/ into any repo before launch</text>
  <rect x="908" y="495" width="10" height="16" fill="#58a6ff" class="cur2"/>
</svg>
